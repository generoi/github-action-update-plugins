name: 'Update'

inputs:
  version:
    required: true
  download_url:
    required: false
  download_path:
    required: false
  changelog:
    required: false
  changelog_extract:
    required: false
  strip_archive_folder:
    description: "Remove the parent folder of the downloaded archive (defaults to true)"
    default: 'true'
    required: false
  heartbeat_days:
    description: >
      Push an empty keepalive commit when the repository is public and its last
      commit is older than this many days, to stop GitHub auto-disabling the
      scheduled workflow (see the Heartbeat step). Set to 0 to disable.
    default: '45'
    required: false

outputs:
  updated:
    description: Whether the update was needed and completed or not
    value: ${{ steps.completed-job.outputs.updated }}
  version:
    description: The version
    value: ${{ steps.completed-job.outputs.version }}

runs:
  using: 'composite'
  steps:
    # An empty `version` is not a theoretical input. When a caller's vendor call
    # fails, the workflow expression feeding this input evaluates to nothing and
    # the action is handed "". That used to sail straight through: the tag check
    # below asks for `refs/tags/` with nothing after it, never matches, sets
    # RUN_BUILD=true, and the checkout is wiped by `git rm -rf .` before the
    # missing download URL is noticed. Nine gravityforms mirrors did exactly
    # that on 2026-08-25 when gravityapi.com went down for a few minutes.
    #
    # The download inputs are checked here too, for the same reason: the "no
    # package" case is worth catching before anything destructive runs, not
    # after.
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.version }}" ]; then
          echo "::error title=Missing version input::The caller passed an empty version, which normally means its vendor update-check failed or returned an unusable body. Refusing to continue - there is nothing to tag."
          exit 1
        fi

        if [ -z "${{ inputs.download_url }}" ] && [ -z "${{ inputs.download_path }}" ]; then
          echo "::error title=Missing package input::Neither download_url nor download_path was set for version ${{ inputs.version }}, so there is no package to extract."
          exit 1
        fi

    - name: Fetch tags
      shell: bash
      run: git fetch --prune --unshallow --tags

    - name: Check if latest version exists
      shell: bash
      run: |
        if git show-ref --tags --verify --quiet "refs/tags/${{ inputs.version }}"; then
          echo "RUN_BUILD=false" >> "$GITHUB_ENV"
        else
          echo "RUN_BUILD=true" >> "$GITHUB_ENV"
        fi

    - name: Install requirements
      if: env.RUN_BUILD == 'true'
      shell: bash
      run: |
        if command -v bsdtar >/dev/null; then
          exit 0
        fi
        # Refresh the package index first, the runner image ships a stale one
        # which points at package versions already removed from the mirrors.
        sudo apt-get update
        sudo apt-get install -y libarchive-tools

    - name: Download and extract the package
      if: env.RUN_BUILD == 'true'
      shell: bash
      run: |
        git rm -rf .
        git clean -fxd

        if [ ! -z "${{ inputs.download_url }}" ]; then
          curl -L '${{ inputs.download_url }}' > package.zip
        else
          mv "${{ inputs.download_path }}" package.zip
        fi

        bsdtar --strip-components=${{ inputs.strip_archive_folder == 'true' && 1 || 0 }} -xvf package.zip
        rm package.zip
        git reset HEAD composer.json .github
        git checkout -- composer.json .github
        git add .

    - name: Create commit message
      shell: bash
      run: |
        {
          echo "v${{ inputs.version }}"
          echo
        } >| /tmp/commit-message

    # The extractor is written by the caller against whatever shape that
    # vendor's changelog happens to have, so it rots quietly: the fetch
    # succeeds, the extractor matches nothing, and the only symptom is a
    # release whose notes are blank. polylang-wc shipped four such releases
    # (2.2.1 through 2.2.4) before anyone looked — its extractor keyed off
    # `= 2.2.4 (2026-07-20) =` headings that the EDD workflow's "Normalise
    # version headings" step had since rewritten to `#### 2.2.4`.
    #
    # So extract to a file and say something when it comes out empty. This
    # also catches the trailing-newline trap described in the relevanssi
    # caller, where the redirect is split onto its own line and the extractor
    # prints to stdout instead — visible in the log, absent from the release.
    - name: Extract changelog
      if: ${{ env.RUN_BUILD == 'true' && inputs.changelog_extract != '' && inputs.changelog == '' }}
      shell: bash
      run: |
        ${{ inputs.changelog_extract }} > /tmp/extracted-changelog

        if [ -s /tmp/extracted-changelog ]; then
          cat /tmp/extracted-changelog >> /tmp/commit-message
        else
          echo "::warning title=Changelog extractor produced nothing::The changelog was fetched but \`changelog_extract\` matched no lines for version ${{ inputs.version }}, so this release will have blank notes. The extractor has most likely drifted from the changelog's current heading format - compare it against the 'Log response' step output above."
        fi

    - name: Retrieve changelog
      if: ${{ env.RUN_BUILD == 'true' && inputs.changelog != '' }}
      shell: bash
      run: |
        echo "${{ inputs.changelog }}" >> /tmp/commit-message

    # Authored as the bot, not as GITHUB_ACTOR. On a scheduled run that variable
    # is whoever last touched the workflow, so a nightly mirror bump across 71
    # repositories lands under the name of someone who was asleep — and a commit
    # that replaces the whole plugin tree looks, in a blame, like they did it by
    # hand. The push already happens as github-actions[bot] via GITHUB_TOKEN;
    # this only makes the authorship agree with it.
    #
    # No numeric id prefix: GitHub links this address to the bot account as-is,
    # which matches morning-reports and github-actions/composer-update.
    - name: Commit the changes and push them
      if: ${{ env.RUN_BUILD == 'true' }}
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit --file /tmp/commit-message
        git tag --annotate ${{ inputs.version }} --file /tmp/commit-message
        git push
        git push origin tag ${{ inputs.version }}

    # Release workflow not triggered from other workflows
    - name: Publish release
      if: ${{ env.RUN_BUILD == 'true' }}
      uses: ghalactic/github-release-from-tag@v6

    # GitHub auto-disables scheduled workflows in PUBLIC repos after 60 days with
    # no repository activity. Workflow *runs* do not count as activity — only
    # pushes do. For a mirror repo the only pushes are version bumps, so the
    # clock is reset solely by upstream shipping a release. That inverts into a
    # trap: the plugins that update least often are exactly the ones GitHub
    # switches off, and then they are never checked again.
    #
    # Observed on generoi/wc-paytrail: last commit 2026-01-21, last scheduled run
    # 2026-03-22 — exactly 60 days later, despite the cron firing daily in
    # between. generoi/woocommerce-gateway-verifone sat dead for ~15 months.
    #
    # So when there is no new version, keep the clock alive with an empty commit.
    # Private repos are exempt from the rule (several are 690 days idle and still
    # active), so skip them and keep their history clean.
    - name: Heartbeat
      if: ${{ env.RUN_BUILD == 'false' && inputs.heartbeat_days != '0' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEARTBEAT_DAYS: ${{ inputs.heartbeat_days }}
      run: |
        set -euo pipefail

        read -r private archived < <(
          gh api "repos/$GITHUB_REPOSITORY" --jq '[.private, .archived] | @tsv'
        )
        if [ "$private" != "false" ] || [ "$archived" != "false" ]; then
          echo "Repo is private or archived — exempt from the 60-day rule, skipping."
          exit 0
        fi

        last=$(git log -1 --format=%ct)
        age=$(( ( $(date +%s) - last ) / 86400 ))
        echo "Last commit was ${age}d ago; heartbeat threshold is ${HEARTBEAT_DAYS}d."
        if [ "$age" -lt "$HEARTBEAT_DAYS" ]; then
          echo "Within threshold, nothing to do."
          exit 0
        fi

        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "chore: keepalive

        No new upstream version in ${age} days. Empty commit to reset GitHub's
        60-day inactivity timer, which would otherwise auto-disable the scheduled
        workflow in this public repository and silently stop update checks."

        # Explicit refspec: the checkout may not have left us on a named branch.
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "::notice title=Keepalive::Pushed an empty commit (last real change was ${age}d ago) to keep the scheduled workflow from being auto-disabled."

    - name: Set output status
      id: completed-job
      shell: bash
      run: |
        echo "updated=${{ env.RUN_BUILD }}" >> $GITHUB_OUTPUT
        echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
