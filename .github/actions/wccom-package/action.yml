name: 'WooCommerce.com Package'

inputs:
  access_token:
    required: true
  access_token_secret:
    required: true
  slug:
    required: false
outputs:
  package:
    description: "Package JSON"
    value: ${{ steps.wccom-package.outputs.REMOTE_RESPONSE }}
runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2

    - name: Get package
      id: wccom-package
      shell: bash
      run: |
        # Capture the package JSON separately so a script failure surfaces its
        # stderr and a clean exit code, instead of leaving an unterminated
        # heredoc in $GITHUB_OUTPUT ("Matching delimiter not found 'EOF'").
        if ! response=$(php "$GITHUB_ACTION_PATH/../../scripts/wccom-get-package.php"); then
          echo "::error::Failed to fetch package from WooCommerce.com (see error above)."
          exit 1
        fi

        {
          echo 'REMOTE_RESPONSE<<EOF'
          echo "$response"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
      env:
        ACCESS_TOKEN: ${{ inputs.access_token }}
        ACCESS_TOKEN_SECRET: ${{ inputs.access_token_secret }}
        PRODUCT_SLUG: ${{ inputs.slug }}

