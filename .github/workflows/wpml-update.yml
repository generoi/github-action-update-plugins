name: WPML
on:
  workflow_call:
    inputs:
      slug:
        required: false
        default: "sitepress-multilingual-cms"
        type: string
      changelog_extract:
        default: "'/^#### / { if (p) { exit }; if ($2 == ver) { p=1; next } } p && NF'"
        type: string
    outputs:
      updated:
        description: "If the update didnt exist and was built"
        value: ${{ jobs.build.outputs.updated }}
      version:
        description: "The updated version"
        value: ${{ jobs.build.outputs.version }}
    secrets:
      USER_ID:
        required: true
      LICENSE_KEY:
        required: true

jobs:
  build:
    name: Update plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Keep only url and version: the full entry embeds the changelog HTML, and an env
      # var over 128 KiB (MAX_ARG_STRLEN) makes every later step fail to spawn bash.
      - name: Retrieve the package information
        run: |
          {
            echo 'REMOTE_RESPONSE<<EOF'
            curl -s -X GET 'http://d2salfytceyqoe.cloudfront.net/wpml33-products.json' | jq --compact-output '.downloads.plugins."${{ inputs.slug }}" | {url, version}'
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Store changelog HTML as a file
        run: |
          {
            curl -s -X GET 'http://d2salfytceyqoe.cloudfront.net/wpml33-products.json' | jq -r '.downloads.plugins."${{ inputs.slug }}".changelog'
          } > changelog.html

      # -smart: with it, pandoc escapes every straight quote as \' or \" in the notes.
      - name: Convert changelog to markdown
        uses: docker://pandoc/core:2.9@sha256:a98725012a960ec77310acef038b57c82b9375bf65ae761d93146448c6e53a31
        with:
          args: >-
            --from=html
            --to=markdown-smart
            --output=changelog.md
            changelog.html

      - name: Read changelog into environment variable
        run: |
          {
            echo 'CHANGELOG<<EOF'
            awk -v ver=${{ fromJson(env.REMOTE_RESPONSE).version }} ${{ inputs.changelog_extract }} changelog.md 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"
          rm changelog.html changelog.md

      - name: Update repo
        uses: gppackagist/github-action-update-plugins@main
        id: update
        with:
          download_url: "${{ fromJson(env.REMOTE_RESPONSE).url }}&user_id=${{ secrets.USER_ID }}&subscription_key=${{ secrets.LICENSE_KEY }}"
          version: ${{ fromJson(env.REMOTE_RESPONSE).version }}
          changelog: ${{ env.CHANGELOG }}
