name: FacetWP
on:
  workflow_call:
    inputs:
      slug:
        required:  false
        default: 'facetwp'
        type: string
      host:
        required: true
        type: string
      changelog_url:
        # A page to take the changelog from, when the update response carries
        # none. facetwp-relevanssi is the case in hand: its response has no
        # usable changelog and every release has been blank, while the addon's
        # help-center page lists the full history.
        #
        # Left empty, the response is used exactly as before.
        required: false
        default: ''
        type: string
    outputs:
      updated:
        description: "If the update didnt exist and was built"
        value: ${{ jobs.build.outputs.updated }}
      version:
        description: "The updated version"
        value: ${{ jobs.build.outputs.version }}
    secrets:
      LICENSE_KEY:
        required: true

jobs:
  build:
    name: Update plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Retrieve the license information
        run: |
          {
            echo 'REMOTE_RESPONSE<<EOF'
            curl -s -d "action=check_plugins&license=${{ secrets.LICENSE_KEY }}&slugs=${{ inputs.slug }}&host=${{ inputs.host }}" "https://api.facetwp.com" | jq '.slugs["${{ inputs.slug }}"]'
            echo -e "\n"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Store changelog HTML as a file
        if: ${{ inputs.changelog_url == '' }}
        run: |
          echo "${{ fromJson(env.REMOTE_RESPONSE).sections.changelog }}" > changelog.html

      - name: Convert changelog to markdown
        if: ${{ inputs.changelog_url == '' }}
        uses: docker://pandoc/core:2.9
        with:
          args: >-
            --from=html
            --to=markdown
            --output=changelog.md
            changelog.html

      - name: Build the changelog from a page instead
        if: ${{ inputs.changelog_url != '' }}
        run: |
          set -uo pipefail
          curl -sSL --max-time 60 --retry 3 --retry-delay 5 \
            -o changelog.html "${{ inputs.changelog_url }}"

          # Converted here rather than by the shared pandoc step above, so the
          # flags a full web page needs cannot change the output of the mirrors
          # that use the response and already publish notes correctly:
          #
          #   --atx-headers            pandoc otherwise writes the version as a
          #                            setext heading underlined with dashes,
          #                            which no `^#### ` extractor can see
          #   markdown_strict-raw_html drops the page markup, so the notes are
          #                            plain text instead of carrying <span> tags
          #                            into the release body
          docker run --rm -v "$PWD:/w" -w /w pandoc/core:2.9 \
            --from=html --to=markdown_strict-raw_html --atx-headers \
            --output=changelog.md changelog.html

      - name: Normalise version headings
        run: |
          # Same rules as edd-update.yml: vendors write version markers in
          # whatever style their readme uses, pandoc passes through anything that
          # is not an HTML heading, and the `#### ` extractor below then matches
          # nothing — leaving an empty release body with no error anywhere.
          #
          # A no-op when the headings are already `#### `, which is the case for
          # the four facetwp-* mirrors that currently publish notes correctly.
          sed -E -i \
            -e 's/^= *v?([0-9][0-9.]*[0-9])[^=]*=[\\]?[[:space:]]*$/#### \1/' \
            -e 's/^Version +v?([0-9][0-9.]*[0-9])([^0-9].*)?$/#### \1/' \
            -e 's/^-[[:space:]]+v?([0-9][0-9.]*[0-9])[[:space:]]*$/#### \1/' \
            -e 's/^#{2,3} +v?([0-9][0-9.]*[0-9])[[:space:]]*$/#### \1/' \
            changelog.md

      - name: Read changelog into environment variable
        run: |
          # Printed because this workflow is the one place in the fleet where a
          # blank release body cannot be diagnosed after the fact: unlike the
          # other updaters, nothing here reads a changelog committed in the repo,
          # so there is no way to reproduce the payload offline. facetwp-relevanssi
          # has published empty notes for every release and the cause is still
          # unknown for exactly this reason.
          echo "Changelog (converted, normalised):"
          cat changelog.md

          {
            echo 'CHANGELOG<<EOF'
            awk -v ver=${{ fromJson(env.REMOTE_RESPONSE).version }} '/^#### / { if (p) { exit }; if ($2 == ver) { p=1; next } } p && NF' changelog.md 2>&1
            echo 'EOF'
          } >> "$GITHUB_ENV"

          if ! grep -q '^#### ' changelog.md; then
            echo "::warning title=No version headings in the changelog::Nothing matches '#### <version>' after normalisation, so this release will have blank notes. The output above shows what the endpoint returned."
          fi

          # -f because only one of the two paths above creates changelog.html.
          rm -f changelog.html changelog.md

      - name: Update repo
        uses: generoi/github-action-update-plugins@master
        id: update
        with:
          download_url: ${{ fromJson(env.REMOTE_RESPONSE).package }}
          version: ${{ fromJson(env.REMOTE_RESPONSE).version }}
          changelog: ${{ env.CHANGELOG }}
