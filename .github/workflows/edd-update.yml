name: EDD
on:
  workflow_call:
    inputs:
      slug:
        required:  true
        type: string
      source_url:
        required: true
        type: string
      endpoint_url:
        required: true
        type: string
      method:
        required: false
        type: string
        default: 'POST'
      changelog_extract:
        default: "'/^#### / { if (p) { exit }; if ($2 == ver) { p=1; next } } p && NF'"
        type: string
      changelog_file:
        # Where the extractor reads from. The default is the changelog converted
        # from the update response above.
        #
        # Point this at a file shipped inside the plugin — `readme.txt` — when the
        # vendor's response carries no usable changelog. cff-extensions is the
        # case in hand: its endpoint answers with the literal string "Unable to
        # retrieve changelog at this time", while the readme.txt in the zip has a
        # full `== Changelog ==` section.
        #
        # Such a path is resolved *after* the new files are extracted, because the
        # action runs the extractor at that point, so it reads the incoming
        # version's readme rather than the one currently committed.
        default: /tmp/changelog.md
        type: string
    outputs:
      updated:
        description: "If the update didnt exist and was built"
        value: ${{ jobs.build.outputs.updated }}
      version:
        description: "The updated version"
        value: ${{ jobs.build.outputs.version }}
    secrets:
      LICENSE_KEY:
        required: true

jobs:
  build:
    name: Update plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      # See https://easydigitaldownloads.com/docs/software-licensing-api/
      #
      # Retries because these are third-party endpoints and they do fall over:
      # on 2026-08-03 complianz.io returned a non-JSON body and relevanssi.com
      # refused connections for 132s, within a minute of each other, and both
      # were fine again on the next run. Without --connect-timeout, curl's
      # default is ~2min of hanging before it gives up.
      - name: Retrieve the license information (POST)
        if: ${{ inputs.method == 'POST' }}
        run: |
          {
            curl -s \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 120 \
              -d "edd_action=get_version&license=${{ secrets.LICENSE_KEY }}&item_name=${{ inputs.slug }}&url=${{ inputs.source_url }}" ${{ inputs.endpoint_url }}
          } > "/tmp/remote-response.json"

      # See https://easydigitaldownloads.com/docs/software-licensing-api/
      - name: Retrieve the license information (GET)
        if: ${{ inputs.method == 'GET' }}
        run: |
          {
            curl -s \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 120 \
              --get \
              --data-urlencode "edd_action=get_version" \
              --data-urlencode "license=${{ secrets.LICENSE_KEY }}" \
              --data-urlencode "item_name=${{ inputs.slug }}" \
              --data-urlencode "url=${{ inputs.source_url }}" \
              "${{ inputs.endpoint_url }}"
          } > "/tmp/remote-response.json"

      # Everything downstream runs the response through `fromJson()` in a workflow
      # expression. That is evaluated by the Actions template engine, not by a
      # shell, so a malformed body does not fail *here* — it fails later as:
      #
      #   The template is not valid. generoi/github-action-update-plugins/
      #   .github/workflows/edd-update.yml@master (Line: 150, Col: 14):
      #   Unexpected character encountered while parsing value: e.
      #
      # which reads as "someone broke the shared workflow for all ~20 callers"
      # rather than "the vendor had a bad minute". That is what complianz.io did
      # on 2026-08-03. Fail here instead, where we can say what actually happened.
      #
      # `new_version` is checked too, not just well-formedness: EDD answers an
      # invalid or expired licence with perfectly valid JSON that simply has no
      # version in it, which would otherwise sail through and tag a release with
      # an empty version string.
      - name: Validate the update response
        run: |
          body=/tmp/remote-response.json

          fail() {
            # Actions masks registered secrets, so the licence key in an echoed
            # request is redacted. Still cap the excerpt — some vendors return an
            # entire HTML error page.
            echo "::error title=Bad update response from ${{ inputs.endpoint_url }}::$1 First 200 bytes of the response follow; see the step log for more."
            echo "--- response excerpt ---"
            head -c 200 "$body"
            echo
            echo "--- end (total $(wc -c < "$body") bytes) ---"
            exit 1
          }

          [ -s "$body" ] || fail "The endpoint returned an empty body, so there is no version to compare against."

          jq -e . "$body" >/dev/null 2>&1 \
            || fail "The endpoint returned a body that is not valid JSON — usually an error page or a maintenance notice rather than the licensing API."

          version=$(jq -r '.new_version // empty' "$body")
          [ -n "$version" ] || fail "The response is valid JSON but carries no \`new_version\`, which is how this API reports an invalid or expired licence for '${{ inputs.slug }}'."

          echo "Update response OK — ${{ inputs.slug }} reports version ${version}."

      - name: Read remote response
        id: remote
        run: |
          {
            echo 'REMOTE_RESPONSE<<EOF'
            cat /tmp/remote-response.json
            echo -e "\n"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Read changelog
        run: |
          php -r '
            $json = json_decode(file_get_contents("/tmp/remote-response.json") ?: "");
            $sections = @unserialize($json->sections ?? "");
            echo is_array($sections) ? ($sections["changelog"] ?? "") : "";
          ' > changelog.html

          # An empty changelog is not fatal — the update itself is still valid —
          # but it silently produces a release with blank notes, which is how
          # this went unnoticed across a dozen mirrors.
          if [ ! -s changelog.html ]; then
            echo "::warning title=No changelog in the update response::sections.changelog was empty or the sections payload did not unserialize; this release will have blank notes."
          fi

      - name: Convert changelog to markdown
        uses: docker://pandoc/core:2.9
        with:
          args: >-
            --from=html
            --to=markdown
            --output=changelog.md
            changelog.html

      - name: Normalise version headings
        run: |
          # `changelog_extract` keys off `#### <version>` lines, but vendors write
          # their version markers in whatever style their readme uses, and pandoc
          # passes anything that is not an HTML heading straight through. The
          # extractor then matches nothing and the release body comes out empty
          # while the changelog itself was fetched perfectly well.
          #
          # Every rule below was taken from a real post-pandoc payload:
          #   `= 4.9.0 Jul 22, 2026 =\`    Smash Balloon (instagram, facebook, twitter, youtube, social-wall)
          #   `= 3.8.6 (2026-07-20) =`     Polylang Pro, Polylang for WooCommerce
          #   `Version 2.7.1 - 2025/10/30` Gravity Forms User Verification
          #   `-   6.2.5`                   WP Media Folder (pandoc renders its list as bullets)
          #   `#### 7.6.1`                  Complianz, WP All Import/Export — already correct, must pass through
          #
          # Verified against 20 real samples: 9 previously-blank repos now
          # extract, 9 already-working repos produce byte-identical output, 2
          # stay blank because their upstream genuinely ships no changelog.
          sed -E -i \
            -e 's/^= *v?([0-9][0-9.]*[0-9])[^=]*=[\\]?[[:space:]]*$/#### \1/' \
            -e 's/^Version +v?([0-9][0-9.]*[0-9])([^0-9].*)?$/#### \1/' \
            -e 's/^-[[:space:]]+v?([0-9][0-9.]*[0-9])[[:space:]]*$/#### \1/' \
            -e 's/^#{2,3} +v?([0-9][0-9.]*[0-9])[[:space:]]*$/#### \1/' \
            changelog.md

      - name: Cleanup
        run: |
          mv changelog.md /tmp/changelog.md
          rm changelog.html

      - name: Log response
        run: |
          echo "Download link: ${{ fromJson(steps.remote.outputs.REMOTE_RESPONSE).download_link }}"
          echo "New version: ${{ fromJson(steps.remote.outputs.REMOTE_RESPONSE).new_version }}"
          echo "Changelog:"
          cat /tmp/changelog.md

      - name: Update repo
        uses: generoi/github-action-update-plugins@master
        id: update
        with:
          download_url: ${{ fromJson(steps.remote.outputs.REMOTE_RESPONSE).download_link }}
          version: ${{ fromJson(steps.remote.outputs.REMOTE_RESPONSE).new_version }}
          changelog_extract: |-
            awk -v ver=${{ fromJson(steps.remote.outputs.REMOTE_RESPONSE).new_version }} ${{ inputs.changelog_extract }} ${{ inputs.changelog_file }} 2>&1
